{# Komponen header section — param: label (mono), title, description (opsional) #}
<div class="max-w-2xl">
  <p class="section-label">{{ label }}</p>
  <h2 class="mt-3 text-3xl font-bold tracking-tight sm:text-4xl">{{ title }}</h2>
  {% if description %}
    <p class="mt-4 leading-relaxed text-slate-600 dark:text-slate-400">{{ description }}</p>
  {% endif %}
</div>
