{% load ui_tags %}
<header class="sticky top-0 z-50 border-b border-slate-200/70 bg-white/80 backdrop-blur dark:border-slate-800/70 dark:bg-slate-950/80">
  <nav class="container-site" aria-label="Navigasi utama">
    <div class="flex h-16 items-center justify-between">

      <a href="{% url 'core:home' %}" class="font-mono text-lg font-bold tracking-tight text-slate-900 dark:text-white">
        ~/<span class="text-sky-600 dark:text-sky-400">portofolio</span>
      </a>

      {# Menu desktop #}
      <div class="hidden items-center gap-7 md:flex">
        <a href="{% url 'core:home' %}" class="nav-link {% nav_active 'core' %}">Beranda</a>
        <a href="{% url 'projects:list' %}" class="nav-link {% nav_active 'projects' %}">Projects</a>
        <a href="{% url 'blog:list' %}" class="nav-link {% nav_active 'blog' %}">Blog</a>
        <a href="{% url 'contact:index' %}" class="nav-link {% nav_active 'contact' %}">Kontak</a>
        {% include "includes/theme_toggle.html" %}
      </div>

      {# Kontrol mobile: tema + hamburger #}
      <div class="flex items-center gap-1 md:hidden">
        {% include "includes/theme_toggle.html" %}
        <button type="button" data-menu-toggle aria-label="Buka menu" aria-expanded="false" aria-controls="mobile-menu" class="rounded-lg p-2 text-slate-600 transition-colors hover:bg-slate-100 dark:text-slate-400 dark:hover:bg-slate-800">
          <svg data-icon-open class="h-6 w-6" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" aria-hidden="true">
            <path stroke-linecap="round" stroke-linejoin="round" d="M3.75 6.75h16.5M3.75 12h16.5m-16.5 5.25h16.5" />
          </svg>
          <svg data-icon-close class="hidden h-6 w-6" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" aria-hidden="true">
            <path stroke-linecap="round" stroke-linejoin="round" d="M6 18 18 6M6 6l12 12" />
          </svg>
        </button>
      </div>
    </div>

    {# Menu mobile (dropdown) #}
    <div data-mobile-menu class="hidden space-y-1 border-t border-slate-200/70 pb-4 pt-3 dark:border-slate-800/70 md:hidden">
      <a href="{% url 'core:home' %}" class="nav-link block rounded-lg px-3 py-2 {% nav_active 'core' %}">Beranda</a>
      <a href="{% url 'projects:list' %}" class="nav-link block rounded-lg px-3 py-2 {% nav_active 'projects' %}">Projects</a>
      <a href="{% url 'blog:list' %}" class="nav-link block rounded-lg px-3 py-2 {% nav_active 'blog' %}">Blog</a>
      <a href="{% url 'contact:index' %}" class="nav-link block rounded-lg px-3 py-2 {% nav_active 'contact' %}">Kontak</a>
    </div>
  </nav>
</header>
